<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>PulseLM</title>
  <style>
    :root {
      --bg: #07090d;
      --panel: #12161e;
      --ink: #f4f7fb;
      --muted: #8b95a7;
      --accent: #3dff9a;
      --line: #1e2532;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Display", sans-serif;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 3rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.05rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 650;
      margin: 0;
    }
    .tag {
      color: var(--muted);
      font-size: 0.75rem;
    }
    .speed-panel {
      background: radial-gradient(120% 80% at 50% 0%, #1a2433 0%, var(--panel) 55%);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      padding: 1.5rem 1.25rem 1.25rem;
      text-align: center;
    }
    .label {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    #ball-speed, .speed-number {
      font-variant-numeric: tabular-nums;
      font-size: clamp(4.2rem, 18vw, 7rem);
      font-weight: 720;
      line-height: 1;
      color: var(--accent);
      margin: 0.35rem 0 0.15rem;
    }
    .unit { color: var(--muted); font-size: 1.1rem; letter-spacing: 0.12em; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      padding: 0.85rem 0.7rem;
      text-align: center;
    }
    .stat b {
      display: block;
      font-size: 1.45rem;
      margin-top: 0.25rem;
      font-variant-numeric: tabular-nums;
    }
    button {
      width: 100%;
      margin-top: 1.25rem;
      background: var(--accent);
      color: #062214;
      border: 0;
      border-radius: 0.9rem;
      padding: 0.95rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    button:active { transform: scale(0.99); }
    .meta {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
    img.raw {
      width: 100%;
      margin-top: 1rem;
      border-radius: 0.9rem;
      border: 1px solid var(--line);
      background: #000;
      min-height: 8rem;
    }
    .range {
      margin-top: 1.25rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      overflow: hidden;
      padding: 0.65rem 0.65rem 0.5rem;
    }
    .range .label { margin: 0 0 0.4rem 0.2rem; }
    .range svg { width: 100%; height: auto; display: block; border-radius: 0.75rem; }
    .range .sky { fill: #0a140e; }
    .range .rough { fill: #16321c; }
    .range .fairway { fill: #2a6a38; }
    .range .target { stroke: #e8f4ea; stroke-width: 1.2; stroke-dasharray: 5 7; }
    .range .tick { stroke: rgba(244, 247, 251, 0.28); stroke-width: 1; }
    .range .tick-label {
      fill: #c9d6cc;
      font-size: 9px;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .range .tee { fill: #8a6a3a; }
    .range .ball { fill: #f4f7fb; stroke: #062214; stroke-width: 1; }
    .range .ball-shadow { fill: rgba(0, 0, 0, 0.35); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>PulseLM</h1>
      <div class="tag">indoor dual-strobe · iPhone display</div>
    </header>
    <section class="grid" id="session" aria-label="Session">
      <div class="stat"><span class="label">Shots</span><b id="sess-n">—</b></div>
      <div class="stat"><span class="label">Avg mph</span><b id="sess-mph">—</b></div>
      <div class="stat"><span class="label">Avg carry</span><b id="sess-carry">—</b></div>
    </section>
    <section class="speed-panel" data-shot-id="{{SHOT_ID}}">
      <div class="label">Ball speed</div>
      <div id="ball-speed" class="speed-number">{{BALL_SPEED_MPH}}</div>
      <div class="unit">MPH</div>
    </section>
    <section class="grid">
      <div class="stat"><span class="label">VLA</span><b id="vla">{{VLA_DEG}}</b></div>
      <div class="stat"><span class="label">Carry</span><b id="carry">{{CARRY_YD}}</b></div>
      <div class="stat"><span class="label">Shot</span><b id="shot-id">{{SHOT_ID}}</b></div>
    </section>
    <section class="grid">
      <div class="stat"><span class="label">HLA</span><b id="hla">{{HLA_DEG}}</b></div>
      <div class="stat"><span class="label">Spin</span><b id="spin">{{SPIN_RPM}}</b></div>
      <div class="stat"><span class="label">Club</span><b id="club">{{CLUB_SPEED}}</b></div>
    </section>
    <button id="arm" type="button">Arm</button>
    <section class="range" aria-label="Driving range">
      <div class="label">Range</div>
      <svg id="range" viewBox="0 0 240 370" role="img" aria-label="Driving range">
        <rect class="sky" x="0" y="0" width="240" height="370"></rect>
        <polygon class="rough" points="8,360 232,360 210,18 30,18"></polygon>
        <polygon class="fairway" points="78,360 162,360 138,18 102,18"></polygon>
        <line class="target" x1="120" y1="360" x2="120" y2="18"></line>
        <g id="yard-ticks"></g>
        <ellipse class="bunker" cx="88" cy="255" rx="16" ry="6" fill="#d4b56a"></ellipse>
        <ellipse class="bunker" cx="155" cy="190" rx="14" ry="5" fill="#d4b56a"></ellipse>
        <g class="flag" transform="translate(120,189)">
          <line x1="0" y1="0" x2="0" y2="-18" stroke="#fff" stroke-width="1.2"></line>
          <polygon points="0,-18 12,-13 0,-8" fill="#e23"></polygon>
        </g>
        <g class="flag" transform="translate(120,86)">
          <line x1="0" y1="0" x2="0" y2="-16" stroke="#fff" stroke-width="1.2"></line>
          <polygon points="0,-16 11,-12 0,-8" fill="#fff"></polygon>
        </g>
        <g class="flag" transform="translate(120,18)">
          <line x1="0" y1="0" x2="0" y2="-14" stroke="#fff" stroke-width="1.2"></line>
          <polygon points="0,-14 10,-10 0,-6" fill="#fff"></polygon>
        </g>
        <path id="tracer" d="" fill="none" stroke="#3dff9a" stroke-width="2" stroke-linecap="round" opacity="0.85"></path>
        <rect class="tee" x="108" y="352" width="24" height="8" rx="2"></rect>
        <g id="session-dots"></g>
        <g id="landing" data-along="{{ALONG_YD}}" data-offline="{{OFFLINE_YD}}" visibility="hidden">
          <ellipse class="ball-shadow" cx="0" cy="4" rx="7" ry="3"></ellipse>
          <circle class="ball" r="6"></circle>
        </g>
      </svg>
    </section>
    <img class="raw" id="raw" alt="dual-strobe capture">
    <p class="meta" id="status">Week 1 · HLA / spin / club null · pulse gap 0.002 s</p>
  </main>
  <script>
    const DEMO = {{DEMO}};
    const RANGE_MAX_YD = 500;
    const RANGE_HALF_YD = 50;
    const TEE_Y = 360;
    const FAR_Y = 18;
    const CENTER_X = 120;
    const OFFLINE_PX = 90;
    (function drawYardTicks() {
      const g = document.getElementById("yard-ticks");
      if (!g) return;
      for (const yd of [50, 100, 150, 200, 250, 300, 350, 400, 450, 500]) {
        const y = TEE_Y - (yd / RANGE_MAX_YD) * (TEE_Y - FAR_Y);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("class", "tick");
        line.setAttribute("x1", "40");
        line.setAttribute("y1", String(y));
        line.setAttribute("x2", "200");
        line.setAttribute("y2", String(y));
        g.appendChild(line);
        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("class", "tick-label");
        t.setAttribute("x", "8");
        t.setAttribute("y", String(y + 3));
        t.textContent = String(yd);
        g.appendChild(t);
      }
    })();
    function fmt(n, digits) {
      if (n === null || n === undefined || n === "") return "—";
      const x = Number(n);
      if (!Number.isFinite(x)) return "—";
      return x.toFixed(digits);
    }
    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }
    function landingFromShot(shot) {
      const carry = shot && shot.carry_yd_est;
      if (carry === null || carry === undefined || carry === "") {
        return { along_yd: null, offline_yd: null, on_line: !shot || shot.hla_deg == null };
      }
      const c = Number(carry);
      if (!Number.isFinite(c)) {
        return { along_yd: null, offline_yd: null, on_line: shot.hla_deg == null };
      }
      if (shot.hla_deg === null || shot.hla_deg === undefined) {
        return { along_yd: c, offline_yd: 0, on_line: true };
      }
      const rad = Number(shot.hla_deg) * Math.PI / 180;
      return {
        along_yd: c * Math.cos(rad),
        offline_yd: c * Math.sin(rad),
        on_line: false
      };
    }
    function placeLanding(landing) {
      const g = document.getElementById("landing");
      const along = landing && Number(landing.along_yd);
      if (!landing || !Number.isFinite(along)) {
        g.setAttribute("visibility", "hidden");
        return;
      }
      const offline = Number(landing.offline_yd);
      const o = Number.isFinite(offline) ? offline : 0;
      const y = TEE_Y - (along / RANGE_MAX_YD) * (TEE_Y - FAR_Y);
      const x = CENTER_X + (o / RANGE_HALF_YD) * OFFLINE_PX;
      g.setAttribute("transform", "translate(" + x + "," + y + ")");
      g.setAttribute("visibility", "visible");
      const tracer = document.getElementById("tracer");
      if (tracer) {
        const cx = (CENTER_X + x) / 2;
        const cy = Math.min(TEE_Y, y) - 48;
        tracer.setAttribute("d", "M " + CENTER_X + " " + TEE_Y + " Q " + cx + " " + cy + " " + x + " " + y);
      }
    }
    function render(shot) {
      if (!shot) return;
      const speed = fmt(shot.ball_speed_mph, 2);
      setText("ball-speed", speed);
      setText("vla", fmt(shot.vla_deg, 1));
      setText("carry", fmt(shot.carry_yd_est, 0));
      setText("hla", fmt(shot.hla_deg, 1));
      setText("spin", fmt(shot.spin_rpm, 0));
      setText("club", fmt(shot.club_speed_mph, 1));
      setText("shot-id", shot.shot_id || "—");
      document.getElementById("status").textContent =
        (shot.ok ? "ok" : (shot.error || "error")) +
        " · pulse_gap_s " + shot.pulse_gap_s +
        (DEMO ? " · demo" : "");
      if (shot.shot_id) {
        document.getElementById("raw").src = "/shot/" + shot.shot_id + "/raw.png?t=" + Date.now();
      }
      placeLanding(landingFromShot(shot));
      refreshRange();
    }
    async function refreshRange() {
      try {
        const r = await fetch("/api/v1/range");
        if (!r.ok) return;
        placeLanding(await r.json());
      } catch (e) { /* keep shot-derived landing */ }
    }
    async function loadSession() {
      try {
        const r = await fetch("/api/v1/session");
        if (!r.ok) return;
        const s = await r.json();
        setText("sess-n", s.shot_count != null ? String(s.shot_count) : "—");
        setText("sess-mph", fmt(s.ball_speed_mph_mean, 1));
        setText("sess-carry", fmt(s.carry_yd_est_mean, 0));
      } catch (e) { /* keep dashes */ }
    }
    async function loadLatest() {
      const r = await fetch("/shot/latest");
      if (!r.ok) return;
      render(await r.json());
      loadSession();
    }
    document.getElementById("arm").addEventListener("click", async () => {
      const r = await fetch("/arm", { method: "POST" });
      render(await r.json());
      loadSession();
    });
    (function applyServerLanding() {
      const g = document.getElementById("landing");
      placeLanding({
        along_yd: Number(g.dataset.along),
        offline_yd: Number(g.dataset.offline)
      });
    })();
    loadLatest();
  </script>
</body>
</html>
